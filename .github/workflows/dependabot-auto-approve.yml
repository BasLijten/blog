name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ github.token }}

      - name: Wait for Netlify validation of the latest SHA
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 900))
          passed_sha=""

          while (( SECONDS < deadline )); do
            current_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            validation="$(gh api "repos/${REPOSITORY}/commits/${current_sha}/check-runs?per_page=100" | jq '[.check_runs[] | select(.name == "Netlify PR validation")] | first // empty')"

            if [[ -n "${validation}" ]]; then
              status="$(jq -r '.status' <<<"${validation}")"
              conclusion="$(jq -r '.conclusion // empty' <<<"${validation}")"

              if [[ "${status}" == completed && "${conclusion}" == success ]]; then
                passed_sha="${current_sha}"
                break
              fi

              if [[ "${status}" == completed ]]; then
                echo "Netlify validation did not pass for ${current_sha}: ${conclusion}" >&2
                exit 1
              fi
            fi

            sleep 15
          done

          [[ -n "${passed_sha}" ]] || { echo "Timed out waiting for Netlify validation." >&2; exit 1; }

          latest_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          [[ "${latest_sha}" == "${passed_sha}" ]] || {
            echo "The PR changed after validation; refusing to merge a stale SHA." >&2
            exit 1
          }

      - name: Approve eligible update
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review "${PR_NUMBER}" --repo "${REPOSITORY}" --approve --body "Dependabot update passed Netlify validation for the latest commit."

      - name: Reconfirm the latest SHA before merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        shell: bash
        run: |
          set -euo pipefail

          latest_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          validation="$(gh api "repos/${REPOSITORY}/commits/${latest_sha}/check-runs?per_page=100" | jq '[.check_runs[] | select(.name == "Netlify PR validation") | select(.status == "completed" and .conclusion == "success")] | first // empty')"

          [[ -n "${validation}" ]] || {
            echo "The latest PR SHA no longer has a successful Netlify validation; refusing to merge." >&2
            exit 1
          }

      - name: Enable auto-merge for eligible update
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --auto --squash

      - name: Leave major update for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "Major Dependabot update requires manual review."
